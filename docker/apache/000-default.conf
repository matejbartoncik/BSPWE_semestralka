<VirtualHost *:80>
    # Hlavní administrační a portálové okno (na samotném localhostu / IP adrese)
    ServerName localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    AliasMatch ^/~([A-Za-z0-9._-]+)(/.*)?$ /srv/www/$1/public$2
</VirtualHost>

<VirtualHost *:80>
    ServerName customer.localhost
    ServerAlias *.localhost

    # Pouzije prvni cast subdomeny (%1) pro nasmerovani do slozky zakaznika
    VirtualDocumentRoot /srv/www/%1/public

    <Directory /srv/www>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/customer_subdomain_error.log
    LogLevel warn
    CustomLog ${APACHE_LOG_DIR}/customer_subdomain_access.log combined
</VirtualHost>
