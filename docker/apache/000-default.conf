<VirtualHost *:80>
    # Hlavní administrační a portálové okno (na samotném localhostu / IP adrese)
    ServerName localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    # Zachování starého odkazu s vlnovkou pro zpětnou kompatibilitu uživatele
    AliasMatch ^/~([A-Za-z0-9._-]+)(/.*)?$ /srv/www/$1/public$2
</VirtualHost>

<VirtualHost *:80>
    # Dynamické weby zákazníků přes testovací "reálné" domény na TLD .cz
    # (zachytí cokoliv.cz nebo www.cokoliv.cz)
    ServerName customer.cz
    ServerAlias *.cz

    # Použije předposlední část domény (%-2) pro přesměrování do správné složky zákazníka
    # (u www.bohdan.cz to vezme "bohdan", u bohdan.cz také "bohdan").
    VirtualDocumentRoot /srv/www/%-2/public

    <Directory /srv/www>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/customer_domain_error.log
    LogLevel warn
    CustomLog ${APACHE_LOG_DIR}/customer_domain_access.log combined
</VirtualHost>

<VirtualHost *:80>
    # Dynamické weby zákazníků přes subdomény 
    # (zachytí cokoliv.localhost nebo cokoliv.192.168.1.50.nip.io atd.)
    ServerName customer.localhost
    ServerAlias *.localhost
    ServerAlias *.nip.io
    ServerAlias *.sslip.io

    # Použije první část domény (%1) pro přesměrování do správné složky zákazníka
    VirtualDocumentRoot /srv/www/%1/public

    <Directory /srv/www>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/customer_error.log
    LogLevel warn
    CustomLog ${APACHE_LOG_DIR}/customer_access.log combined
</VirtualHost>
