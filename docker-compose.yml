services:
  web:
    build:
      context: .
      dockerfile: docker/apache/Dockerfile
    container_name: hosting_web
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html:rw
      # Zakaznicke weby - subdomeny (*.localhost) i adresarovy hosting (localhost:8080/~customer)
      - ./data/www:/srv/www:rw
      # apache config – pro nastavení virtual hostů, přesměrování atd.
      - ./docker/apache/000-default.conf:/etc/apache2/sites-enabled/000-default.conf:ro
      # FTP - přístup k users db, pro manipulaci přes pure-pw
      - ./data/ftp/passwd:/etc/pure-ftpd/passwd:rw
    depends_on:
      - db
    networks:
      - hosting_net

  db:
    image: mariadb:10.11
    container_name: hosting_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./data/mariadb:/var/lib/mysql:rw
    ports:
      - "3306:3306"
    networks:
      - hosting_net

  ftp:
    image: stilliard/pure-ftpd
    container_name: hosting_ftp
    command: /bin/sh -c "/run.sh -l puredb:/etc/pure-ftpd/passwd/pureftpd.pdb -E -j -R -P $$PUBLICHOST"
    restart: unless-stopped
    environment:
      PUBLICHOST: "localhost"
      ADDED_FLAGS: "--passiveportrange 30000:30009"
    volumes:
      - ./data/www:/home:rw
      - ./data/ftp/passwd:/etc/pure-ftpd/passwd:rw
    ports:
      - "2121:21"
      - "30000-30009:30000-30009"
    networks:
      - hosting_net

  pma:
    image: phpmyadmin/phpmyadmin
    container_name: hosting_pma
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "8081:80"
    networks:
      - hosting_net

  docs:
    image: squidfunk/mkdocs-material
    container_name: hosting_docs
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./:/docs
    command: serve -a 0.0.0.0:8000

networks:
  hosting_net:
    driver: bridge
